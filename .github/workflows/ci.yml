name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cpp-sdk:
    name: Test C++ SDK (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure C++ SDK tests
        run: cmake -S sdk -B build/cpp-sdk -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ SDK tests
        run: cmake --build build/cpp-sdk --config Release

      - name: Test C++ SDK
        run: ctest --test-dir build/cpp-sdk -C Release --output-on-failure

  build:
    name: Check, test, and build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Check API formatting
        run: cargo fmt -p highfleet-mod-api -p highfleet-patchy-client -p patchy-test-mod -- --check

      - name: Lint API
        run: cargo clippy --locked -p highfleet-mod-api -p highfleet-patchy-client -p patchy-test-mod --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Test the Patchy capability with a mod DLL
        shell: pwsh
        run: |
          cargo build -p patchy-test-mod --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATCHY_TEST_MOD = Join-Path $env:GITHUB_WORKSPACE 'target\x86_64-pc-windows-msvc\debug\patchy_test_mod.dll'
          cargo test -p highfleet-loader --lib --locked -- --ignored --exact loader::tests::unknown_build_still_initializes_a_patchy_mod_that_declines_the_version | Tee-Object -Variable output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # libtest succeeds when a filter selects nothing, so require the run.
          if (-not ($output -match '^test result: ok\. 1 passed')) {
            Write-Error 'The Patchy DLL test did not run'
            exit 1
          }

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Build release DLL
        run: cargo build --release -p highfleet-loader --locked

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact
          Copy-Item target\x86_64-pc-windows-msvc\release\bass.dll artifact\
          Copy-Item bass.dll_, README.md, LICENSE artifact\
          Copy-Item -Recurse sdk artifact\sdk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: highfleet-modloader-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 14
