[package]
name = "highfleet-loader"
version = "0.1.0"
edition = "2021"
# build = "build.rs"

[workspace]
members = ["crates/highfleet-mod-api"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
proxygen-macros = { git = "https://github.com/logdot/proxygen.git", rev = "bf8f791f5c208a750a05d8522d223d82a523ccde" }
libc = "0.2.149"
libloading = "0.8"
log = "0.4.*"
highfleet-mod-api = { path = "crates/highfleet-mod-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.*"
flexi_logger = "0.29.0"
winapi = { version = "0.3.9", features = [
    "minwindef",
    "libloaderapi",
    "processthreadsapi",
    "consoleapi",
    "processenv",
    "winbase",
    "winuser",
    "errhandlingapi",
] }


[lib]
name = "bass"
crate-type = ["cdylib"]
